plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.example.refurbishedcams'
base { archivesName = 'refurbishedcams-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { refurbishedcams { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods { refurbishedcams { source sourceSets.main } }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        forRepositories(fg.repository) // lets ForgeGradle remap the downloaded mod to official mappings
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // MrCrayfish's Furniture Mod: Refurbished 1.0.12 (Forge 1.20.1)
    implementation fg.deobf('curse.maven:refurbished-furniture-897116:6272885')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
